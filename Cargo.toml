[package]
name = "hustlx-oss"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Offline-first multi-sport Game Day desktop application"
repository = "https://github.com/HustlX-Apps/hustlx-oss"

[features]
default = ["desktop"]
desktop = ["dep:iced", "dep:rfd", "dep:open"]

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
iced = { version = "0.14", optional = true, default-features = false, features = ["wgpu", "tiny-skia", "crisp", "thread-pool", "svg", "tokio"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
ttf-parser = "0.25"
printpdf = { version = "0.8", default-features = false, features = ["png"] }
rfd = { version = "0.15", optional = true }
open = { version = "5", optional = true }

[[bin]]
name = "hustlx-oss"
path = "src/main.rs"
required-features = ["desktop"]

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"
