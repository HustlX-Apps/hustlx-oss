name: Desktop release
run-name: Desktop packages (${{ github.event_name }}, publish=${{ inputs.publish || false }})

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.*'
      - '.cargo/**'
      - 'xtask/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo version without v prefix
        required: true
        type: string
      source_sha:
        description: Full commit SHA of the selected branch
        required: true
        type: string
      publish:
        description: Publish a GitHub Release after all builds pass (main only)
        type: boolean
        default: false

permissions:
  contents: read

# Do not interrupt a publishing run halfway through its tag/draft/uploads.
concurrency:
  group: desktop-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust tooling
        run: rustup toolchain install stable --profile minimal
      - name: Release safety tests
        run: python -m unittest discover -s scripts -p test_github_release.py -v
      - name: Validate exact source and version
        id: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_release.py validate

  native:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Install target
        run: rustup target add ${{ matrix.target }} --toolchain stable
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Test
        run: cargo +stable test --locked --workspace --all-targets
      - name: Release safety tests
        run: python -m unittest discover -s scripts -p test_github_release.py -v
      - name: Clippy
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: ./scripts/release.sh --version "$RELEASE_VERSION" --target "$RELEASE_TARGET"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: ./scripts/release.ps1 -Version $env:RELEASE_VERSION -Target $env:RELEASE_TARGET
      - name: Retain packages from this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            dist/*/*.zip
            dist/*/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  verify-assets:
    needs: [validate, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: artifacts
      - name: Validate all archives and checksums
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: python3 scripts/github_release.py collect --version "$RELEASE_VERSION"

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'HustlX-Apps/hustlx-oss'
    needs: [validate, native, verify-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: artifacts
      - name: Create tag, upload draft assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: python3 scripts/github_release.py publish --version "$RELEASE_VERSION"
