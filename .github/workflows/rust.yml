name: Rust desktop

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Test
        run: cargo +stable test --locked --workspace --all-targets
      - name: Clippy
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Release safety tests
        run: python -m unittest discover -s scripts -p test_github_release.py -v
      - name: Build native application
        run: cargo +stable build --locked
      - name: Dry-run macOS packaging wrapper
        if: runner.os == 'macOS'
        run: scripts/release.sh --version "$(cargo xtask version)" --dry-run
      - name: Dry-run Windows packaging wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseVersion = cargo xtask version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/release.ps1 -Version $releaseVersion -DryRun
