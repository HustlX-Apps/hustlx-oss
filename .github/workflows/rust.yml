name: Rust desktop

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Test
        run: cargo +stable test --locked --all-targets
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Build native application
        run: cargo +stable build --locked
